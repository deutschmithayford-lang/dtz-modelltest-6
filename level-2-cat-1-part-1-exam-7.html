<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Deutsch mit Hayford</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;1,9..144,300&family=DM+Sans:wght@400;500&display=swap">
  <style>
    :root{
      --bg:#F9F7F4;--surface:#FFF;--border:#E6E2DB;
      --text:#1C1A18;--muted:#7A766F;--accent:#1A5738;
      --done:#1A5738;--partial:#C45D18;--pending:#B0ABA4;
      --notice-bg:#F3F1EC;--notice-border:#D4CFC7;
      --correct:#1A5738;--wrong:#B83232;
    }
    @media(prefers-color-scheme:dark){:root:not([data-theme=light]){
      --bg:#161614;--surface:#1F1E1B;--border:#2E2C28;
      --text:#ECEAE5;--muted:#8A867F;--accent:#4DAA7A;
      --done:#4DAA7A;--partial:#E0834A;--pending:#4A4844;
      --notice-bg:#27261F;--notice-border:#3A3830;
      --correct:#4DAA7A;--wrong:#E55A4E;
    }}
    :root[data-theme=dark]{
      --bg:#161614;--surface:#1F1E1B;--border:#2E2C28;
      --text:#ECEAE5;--muted:#8A867F;--accent:#4DAA7A;
      --done:#4DAA7A;--partial:#E0834A;--pending:#4A4844;
      --notice-bg:#27261F;--notice-border:#3A3830;
      --correct:#4DAA7A;--wrong:#E55A4E;
    }
    *,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
    body{font-family:'DM Sans',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:48px 20px 64px;}
    .wrap{width:100%;max-width:700px;display:flex;flex-direction:column;gap:32px;}
    .brand{padding-bottom:24px;border-bottom:1px solid var(--border);}
    .brand-name{font-family:'Fraunces',Georgia,serif;font-size:clamp(1.8rem,5vw,2.6rem);font-weight:600;line-height:1.1;letter-spacing:-0.02em;text-wrap:balance;}
    .brand-name em{font-style:italic;font-weight:300;color:var(--accent);}
    .brand-sub{font-size:.8rem;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;font-weight:500;margin-top:6px;}
    .legend{display:flex;gap:18px;flex-wrap:wrap;}
    .leg{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted);font-weight:500;letter-spacing:.04em;text-transform:uppercase;}
    .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
    .dot.done{background:var(--done);}.dot.partial{background:var(--partial);}.dot.pending{background:var(--pending);}
    .list{display:flex;flex-direction:column;gap:5px;}
    .ex{border:1px solid var(--border);border-radius:8px;overflow:hidden;background:var(--surface);}
    .ex-hd{display:grid;grid-template-columns:4px 1fr auto;gap:0 14px;align-items:center;cursor:pointer;user-select:none;}
    .ex-hd:hover{background:rgba(26,87,56,.05);}
    .stripe{min-height:52px;}.stripe.done{background:var(--done);}.stripe.partial{background:var(--partial);}.stripe.pending{background:var(--pending);}
    .ex-lbl{padding:13px 0;}.ex-num{font-size:.72rem;color:var(--muted);font-weight:500;letter-spacing:.03em;margin-bottom:2px;}.ex-title{font-size:.93rem;}
    .ex-right{display:flex;align-items:center;gap:8px;padding-right:14px;flex-shrink:0;}
    .badge{font-size:.78rem;font-weight:500;font-variant-numeric:tabular-nums;white-space:nowrap;}
    .badge.done{color:var(--done);}.badge.partial{color:var(--partial);}.badge.pending{color:var(--pending);}
    .chevron{color:var(--muted);transition:transform .2s;font-size:.75rem;}
    .ex.open .chevron{transform:rotate(180deg);}
    .ex-body{display:none;padding:0 18px 22px;border-top:1px solid var(--border);}
    .ex.open .ex-body{display:block;}
    .instr{font-size:.82rem;color:var(--muted);margin-top:14px;margin-bottom:12px;font-style:italic;}
    /* Notice board */
    .notice{background:var(--notice-bg);border:1px solid var(--notice-border);border-radius:6px;padding:14px 16px;margin-bottom:20px;}
    .notice-row{padding:6px 0;border-bottom:1px solid var(--notice-border);font-size:.875rem;line-height:1.5;}
    .notice-row:last-child{border-bottom:none;padding-bottom:0;}
    .notice-row strong{display:inline-block;min-width:130px;color:var(--text);font-weight:500;}
    /* Questions */
    .q-list{display:flex;flex-direction:column;gap:12px;margin-bottom:18px;}
    .q{border-bottom:1px solid var(--border);padding-bottom:12px;}
    .q:last-child{border-bottom:none;padding-bottom:0;}
    .q-text{font-size:.9rem;margin-bottom:8px;line-height:1.4;}
    .q-num{font-weight:600;color:var(--accent);margin-right:4px;}
    .q-opts{display:flex;flex-direction:column;gap:5px;}
    .q-opts label{display:flex;align-items:center;gap:8px;font-size:.875rem;cursor:pointer;padding:6px 10px;border-radius:5px;border:1px solid var(--border);transition:all .15s;color:var(--muted);}
    .q-opts label:has(input:checked){border-color:var(--accent);color:var(--text);background:rgba(26,87,56,.07);}
    .q-opts input{accent-color:var(--accent);width:14px;height:14px;flex-shrink:0;}
    .opt-lbl{font-weight:600;min-width:18px;color:var(--accent);}
    .q.ok .q-opts label:has(input:checked){border-color:var(--correct);background:rgba(26,87,56,.1);color:var(--correct);}
    .q.err .q-opts label:has(input:checked){border-color:var(--wrong);background:rgba(184,50,50,.1);color:var(--wrong);}
    .q.ok .q-text .q-num::before{content:"✓ ";color:var(--correct);}
    .q.err .q-text .q-num::before{content:"✗ ";color:var(--wrong);}
    .hint{font-size:.78rem;color:var(--correct);margin-top:5px;display:none;padding-left:10px;}
    .q.err .hint{display:block;}
    .check-btn{background:var(--accent);color:#fff;border:none;padding:10px 22px;border-radius:6px;font-size:.875rem;font-family:'DM Sans',system-ui,sans-serif;font-weight:500;cursor:pointer;transition:opacity .15s;}
    .check-btn:hover{opacity:.85;}
    .score{margin-top:12px;font-size:.875rem;font-weight:500;display:none;}
    .score.show{display:block;}.score .sc-val{color:var(--accent);}
    .sig{display:flex;align-items:baseline;justify-content:space-between;padding-top:20px;border-top:1px solid var(--border);flex-wrap:wrap;gap:8px;}
    .sig-mark{font-family:'Fraunces',Georgia,serif;font-size:1rem;font-weight:300;font-style:italic;color:var(--accent);}
    .sig-copy{font-size:.75rem;color:var(--muted);letter-spacing:.04em;}
  </style>
</head>

function cls(s){return s===100?"done":s>0?"partial":"pending";}

const list=document.getElementById("list");
EX.forEach((ex,i)=>{
  const c=cls(ex.s);
  const div=document.createElement("div");
  div.className="ex";

  // Build section HTML
  const secHtml=ex.sec.map(([name,desc])=>
    `<div class="notice-row"><strong>${name}</strong>${desc}</div>`
  ).join("");

  // Build question HTML
  const qHtml=ex.q.map(([qt,opts,],qi)=>{
    const labels=["a","b","c"];
    const optHtml=opts.map((o,j)=>
      `<label><input type="radio" name="q_${i}_${qi}" value="${o}"><span class="opt-lbl">${labels[j]})</span>${o}</label>`
    ).join("");
    return `<div class="q" id="q_${i}_${qi}" data-ans="${ex.q[qi][2]}">
      <p class="q-text"><span class="q-num">${qi+1}.</span> ${qt}</p>
      <div class="q-opts">${optHtml}</div>
      <p class="hint"></p>
    </div>`;
  }).join("");

  div.innerHTML=`
<div class="ex-hd" tabindex="0" role="button" aria-expanded="false">
  <div class="stripe ${c}"></div>
  <div class="ex-lbl"><div class="ex-num">Übung ${ex.n}</div><div class="ex-title">${ex.t}</div></div>
  <div class="ex-right"><span class="badge ${c}">${ex.s===0?"–":ex.s+" %"}</span><span class="chevron">▾</span></div>
</div>
<div class="ex-body">
  <p class="instr">Lesen Sie die Aufgaben 1–5 und die Information. Kreuzen Sie an: a, b oder c.</p>
  <div class="notice">${secHtml}</div>
  <div class="q-list">${qHtml}</div>
  <button class="check-btn">Antworten prüfen</button>
  <p class="score"></p>
</div>`;

  const hd=div.querySelector(".ex-hd");
  function toggle(){div.classList.toggle("open");hd.setAttribute("aria-expanded",div.classList.contains("open"));}
  hd.addEventListener("click",toggle);
  hd.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();toggle();}});

  div.querySelector(".check-btn").addEventListener("click",()=>{
    let ok=0;
    ex.q.forEach(([_,opts,ans],qi)=>{
      const qEl=div.querySelector(`#q_${i}_${qi}`);
      const sel=div.querySelector(`input[name="q_${i}_${qi}"]:checked`);
      const hint=qEl.querySelector(".hint");
      qEl.classList.remove("ok","err");
      if(sel&&sel.value===ans){qEl.classList.add("ok");ok++;hint.textContent="";}
      else{qEl.classList.add("err");hint.textContent="Richtige Antwort: "+ans;}
    });
    const sc=div.querySelector(".score");
    sc.className="score show";
    sc.innerHTML=`Ergebnis: <span class="sc-val">${ok} von 5</span> richtig`;
  });

  list.appendChild(div);
});
</script>

</html>
